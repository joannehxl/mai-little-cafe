<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mai Little Cafe — Reset Password</title><style>*{box-sizing:border-box}body{margin:0;background:#faf6ed;color:#49352e;font-family:system-ui,-apple-system,sans-serif}main{max-width:440px;margin:8vh auto;padding:22px}.muted{color:#826f63;font-size:14px;line-height:1.5}.panel{background:#fff;border:1px solid #e9ded1;border-radius:18px;padding:24px;margin-top:18px}h1{font-size:26px}label{display:block;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #d8c6b7;border-radius:10px;font:inherit}button{width:100%;padding:13px;border:0;border-radius:11px;background:#513b31;color:#fff;font:inherit;margin-top:18px}button:disabled{opacity:.5}#change{display:none}#status{line-height:1.5;font-size:14px}</style></head><body><main><p class="muted">mai little café.</p><h1>Reset staff password</h1><div class="panel"><form id="request"><p class="muted">Enter your staff login email to receive a fresh password-reset link.</p><label for="email">Email</label><input type="email" id="email" autocomplete="email" required><button type="submit">Send reset email</button></form><form id="change"><label for="password">New password</label><input type="password" id="password" autocomplete="new-password" minlength="12" required><label for="confirm">Confirm new password</label><input type="password" id="confirm" autocomplete="new-password" minlength="12" required><button type="submit">Update password</button></form><p id="status" role="status" aria-live="polite"></p></div><p class="muted">Use only a newly generated recovery link. Never share recovery links or passwords.</p><p><a href="staff-login.html">Back to staff login</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),status=$('status');if(!window.supabase){status.textContent='Login service unavailable. Please reload.';return}const client=window.supabase.createClient('https://exfbjssyljnhowzhfupi.supabase.co','sb_publishable_w9gKKsSln4uu8Ar2zdsNhA_ilyHsuJa',{auth:{detectSessionInUrl:true,persistSession:true}});
function showChange(){$('request').style.display='none';$('change').style.display='block';status.textContent='Choose a new password (at least 12 characters).'}
client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showChange()});
const params=new URLSearchParams(location.search),fragment=new URLSearchParams(location.hash.slice(1));if(params.get('error')||fragment.get('error'))status.textContent='Recovery link expired or invalid. Request a fresh one.';
const {data:{session}}=await client.auth.getSession();if(session&&(params.has('code')||fragment.has('access_token')))showChange();
$('request').addEventListener('submit',async e=>{e.preventDefault();status.textContent='Requesting reset email…';const {error}=await client.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo:'https://joannehxl.github.io/mai-little-cafe/reset-password.html'});status.textContent=error?'Unable to request reset: '+error.message:'If this email has an account, a reset link will be sent. Check your inbox and spam folder.'});
$('change').addEventListener('submit',async e=>{e.preventDefault();if($('password').value!==$('confirm').value){status.textContent='Passwords do not match.';return}const {error}=await client.auth.updateUser({password:$('password').value});$('password').value='';$('confirm').value='';if(error){status.textContent='Could not update password: '+error.message;return}status.textContent='Password updated successfully. You can now sign in.';$('change').style.display='none';await client.auth.signOut()});
})();
</script></body></html>
