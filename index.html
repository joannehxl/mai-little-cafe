:92dvh;overflow:auto}.sheet h2{margin:0 0 12px}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.field select,.field input,.field textarea{width:100%;border:1px solid #cdbfb0;border-radius:9px;background:white;padding:12px}.close{float:right;border:0;background:transparent;font-size:24px}.cartrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e5d9ca}.notice{background:#f0e7db;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.qr{width:min(100%,280px);display:block;margin:15px auto}.hidden{display:none!important}footer{text-align:center;font-size:12px;color:#86786e;padding:24px}.file{border:2px dashed #d5c4b5;border-radius:12px;padding:18px}.small{font-size:12px}.logo{height:38px;width:38px;object-fit:cover;border-radius:50%}@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}.hero{border-radius:0 0 20px 20px}}

</style></head><body><header><div style="display:flex;align-items:center;gap:8px"><img class="logo" src="assets/logo.jpeg" alt="Mai Little Cafe logo"><span class="brand">mai little café.</span></div><button class="pill" onclick="showCart()">Bag <span id="count">0</span></button></header><section class="hero"><div><p>YOUR LITTLE DAILY RITUAL ♡</p><h1>something<br>lovely awaits.</h1><p>Matcha, coffee & little treats.</p><button class="pill" onclick="document.querySelector('main').scrollIntoView({behavior:'smooth'})">Explore menu ↓</button></div><img src="assets/strawberry.jpeg" alt="Strawberry Matcha"></section><main><h2>our menu.</h2><div class="chips" id="chips"></div><div class="products" id="products"></div></main><footer>mai little café · Made with a little love ♡<br><strong>TEST SITE — NOT ACCEPTING REAL ORDERS</strong></footer><div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><section class="sheet" id="sheet"></section></div><script>

const SB_URL='https://exfbjssyljnhowzhfupi.supabase.co', SB_KEY='sb_publishable_w9gKKsSln4uu8Ar2zdsNhA_ilyHsuJa';
const photos={'Strawberry Matcha':'strawberry.jpeg','Biscoff Matcha':'biscoff.jpeg','Cookies & Cream Matcha':'cookiesmatcha.jpeg','Pistachio Cloud Matcha':'pistachiomatcha.jpeg','Peanut Butter Latte':'peanut.jpeg','Cookies and Cream Latte':'cookieslatte.jpeg','Salted Maple Jasmine Coffee':'jasmine.jpeg','Cold Brew Black':'black.jpeg','Salted Maple Cold Brew':'maplecoldbrew.jpeg','Pistachio Cloud Cold Brew':'pistachiocoldbrew.jpeg'};
let menu=[],sweetness=[],addons=[],allowedAddons=[],iceOptions=[],fillOptions=[],category='Matcha',cart=[],selected=null;
const $=id=>document.getElementById(id),money=x=>'S$'+Number(x).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function getTable(table,order=''){const res=await fetch(SB_URL+'/rest/v1/'+table+'?select=*'+(order?'&order='+order:''),{headers:{apikey:SB_KEY}});if(!res.ok){let detail=await res.text();throw Error(table+' HTTP '+res.status+': '+detail.slice(0,250))}return res.json()}
async function loadMenu(){try{menu=await getTable('cafe_menu','display_order.asc');const names=['cafe_sweetness_options','cafe_addons','cafe_menu_addons','cafe_ice_options','cafe_fill_options'];const results=await Promise.allSettled(names.map(n=>getTable(n,n==='cafe_menu_addons'?'':'display_order.asc')));[sweetness,addons,allowedAddons,iceOptions,fillOptions]=results.map((r,i)=>{if(r.status==='rejected'){console.warn('Optional menu configuration unavailable:',names[i],r.reason);return []}return r.value});render()}catch(e){$('products').innerHTML='<div class="notice">Menu is temporarily unavailable. Supabase connection error: '+esc(e.message)+'</div>';console.error('Menu loading failed:',e)}}
function render(){const categories=[...new Set(menu.map(m=>m.category))];if(!categories.includes(category))category=categories[0]||'Matcha';$('chips').innerHTML=categories.map(k=>'<button class="chip '+(k===category?'active':'')+'" data-category="'+esc(k)+'">'+esc(k)+'</button>').join('');$('chips').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.category;render()}));const items=menu.filter(m=>m.category===category&&m.available);$('products').innerHTML=items.map(m=>'<article class="product">'+(photos[m.name]?'<img src="assets/'+photos[m.name]+'" alt="'+esc(m.name)+'">':'')+'<div class="details"><strong>'+esc(m.name)+'</strong><span class="muted">'+money(m.price)+(m.hot_available?' · Hot available':'')+'</span><button class="pill" data-id="'+esc(m.id)+'">Add +</button></div></article>').join('');$('products').querySelectorAll('button[data-id]').forEach(b=>b.addEventListener('click',()=>customise(b.dataset.id)));$('count').textContent=cart.length}
function openSheet(html){$('sheet').innerHTML='<button class="close" aria-label="Close" onclick="closeSheet()">×</button>'+html;$('overlay').classList.add('show')}
function closeSheet(){$('overlay').classList.remove('show')}
function field(id,label,choices,required=true){return '<div class="field"><label for="'+id+'">'+esc(label)+(required?' *':'')+'</label><select id="'+id+'"><option value="">Choose an option</option>'+choices.map(c=>'<option value="'+esc(c[0])+'">'+esc(c[1])+'</option>').join('')+'</select></div>'}
function val(id){return $(id)?.value||''}
function itemSweet(m){return sweetness.filter(s=>s.menu_item_id===m.id)}
function itemAddons(m){const ids=new Set(allowedAddons.filter(x=>x.menu_item_id===m.id).map(x=>x.addon_id));return addons.filter(a=>ids.has(a.id))}
function customise(id){selected=menu.find(m=>m.id===id);if(!selected)return;const m=selected,s=itemSweet(m),a=itemAddons(m),dessert=m.category==='Desserts';let html='<h2>'+esc(m.name)+'</h2><p>'+money(m.price)+'</p>';
if(m.hot_available&&m.iced_available)html+=field('temp','Temperature',[['Iced','Iced'],['Hot','Hot']]);
else if(!dessert)html+='<p class="muted">Iced only</p>';
if(s.length)html+=field('sweet','Sweetness',s.map(x=>[x.value,x.label+(x.description?' — '+x.description:'')]));
if(!dessert)html+='<div id="iceWrap">'+field('ice','Ice level',iceOptions.map(x=>[x.value,x.label]))+'<div id="fillWrap"></div><div id="iceNote"></div></div>';
if(a.length)html+='<div class="field"><label>Add-ons (optional)</label>'+a.map(x=>x.name==='Extra Matcha (1g)'?'<div class="field"><label for="extraMatcha">Extra Matcha (S$0.50 per gram)</label><select id="extraMatcha" data-addon-id="'+esc(x.id)+'"><option value="0">None</option><option value="1">+1g (+S$0.50)</option><option value="2">+2g (+S$1.00)</option><option value="3">+3g (+S$1.50)</option></select></div>':'<label class="checkoption"><input type="checkbox" class="addon" value="'+esc(x.id)+'"> '+esc(x.name)+' (+'+money(x.price)+')</label>').join('')+'</div>';
html+='<p id="selectionError" class="error" role="alert"></p><button class="mainbtn" onclick="addItem()">Add to bag</button>';
openSheet(html);$('temp')?.addEventListener('change',updateIce);$('ice')?.addEventListener('change',updateFill);updateIce()}
function updateIce(){if(!$('iceWrap'))return;const hot=val('temp')==='Hot';$('iceWrap').classList.toggle('hidden',hot);if(hot){$('ice').value='';$('fillWrap').innerHTML='';$('iceNote').innerHTML=''}else updateFill()}
function updateFill(){if(!$('ice'))return;const v=val('ice');$('fillWrap').innerHTML='';$('iceNote').innerHTML='';if(selected.name==='Jasmine Tea'&&(v==='less'||v==='none')){$('iceNote').innerHTML='<div class="notice">Your cup will be filled with jasmine tea regardless of the ice level selected, at no extra charge.</div>';return}if(v==='less'){const canTopUp=selected.milk_topup_allowed&&selected.name.trim().toLowerCase()!=='tokyo fog';if(!canTopUp){$('fillWrap').innerHTML='<div class="notice">No top-up available for this drink. With Less Ice, your cup will not be full. The original flavour and strength are maintained.</div>';return}const choices=fillOptions.filter(f=>!f.requires_milk_compatibility||canTopUp).map(f=>[f.value,f.label+' — '+f.description]);$('fillWrap').innerHTML=field('fill','Less Ice fill level',choices)}else if(v==='none')$('iceNote').innerHTML='<div class="notice">Your drink will be prepared without ice using our standard recipe. The cup will not be full, as we do not add extra milk to maintain the intended flavour.</div>'}
function addItem(){const m=selected,hot=val('temp')==='Hot',dessert=m.category==='Desserts',s=itemSweet(m),a=itemAddons(m),error=$('selectionError');if(!dessert&&m.hot_available&&m.iced_available&&!val('temp')){error.textContent='Please choose a temperature.';return}if(s.length&&!val('sweet')){error.textContent='Please choose your sweetness level.';return}if(!dessert&&!hot&&!val('ice')){error.textContent='Please choose an ice level.';return}if(!dessert&&!hot&&val('ice')==='less'&&m.milk_topup_allowed&&m.name.trim().toLowerCase()!=='tokyo fog'&&!val('fill')){error.textContent='Please choose a fill level.';return}
const picked=[...document.querySelectorAll('.addon:checked')].map(x=>a.find(y=>y.id===x.value)).filter(Boolean),matchaGrams=Number(val('extraMatcha')||0),matchaAddon=a.find(x=>x.name==='Extra Matcha (1g)'),sOption=s.find(x=>x.value===val('sweet')),fill=fillOptions.find(x=>x.value===val('fill'));let details=[dessert?'':hot?'Hot':'Iced',sOption?.label,(!dessert&&!hot)?iceOptions.find(x=>x.value===val('ice'))?.label:'',fill?.label,...picked.map(x=>x.name),...(matchaAddon&&matchaGrams?[`Extra Matcha +${matchaGrams}g`]:[])].filter(Boolean).join(' · ');const price=Number(m.price)+picked.reduce((sum,x)=>sum+Number(x.price),0)+(matchaAddon?matchaGrams*Number(matchaAddon.price):0);cart.push({menu_item_id:m.id,name:m.name,quantity:1,temperature:dessert?null:hot?'hot':'iced',sweetness:sOption?.value||null,ice:dessert||hot?null:val('ice'),fill:dessert||hot||val('ice')!=='less'?null:(m.name==='Jasmine Tea'?'tea_topup':(m.milk_topup_allowed&&m.name.trim().toLowerCase()!=='tokyo fog'?val('fill'):'no_topup')),addon_ids:[...picked.map(x=>x.id),...(matchaAddon&&matchaGrams?[matchaAddon.id]:[])],extra_matcha_grams:matchaGrams,details,price});closeSheet();render()}
const PICKUP_BUFFER_MINUTES=5;
let liveWaitMinutes=null,liveWaitUpdatedAt=0;
async function refreshLiveWait(){try{const response=await fetch(SB_URL+'/rest/v1/rpc/get_public_wait_minutes',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:'{}',cache:'no-store'});if(!response.ok)throw Error('Queue estimate unavailable');const value=await response.json();if(!Number.isFinite(Number(value))||Number(value)<0)throw Error('Invalid queue estimate');liveWaitMinutes=Math.ceil(Number(value));liveWaitUpdatedAt=Date.now()}catch(e){liveWaitMinutes=null;console.warn('Could not load live wait estimate',e)}updatePickupEstimate()}
function orderCups(){return cart.reduce((sum,item)=>sum+(menu.find(m=>m.id===item.menu_item_id)?.category==='Desserts'?0:Number(item.quantity)||1),0)}
function estimatedPickupMinutes(){if(liveWaitMinutes===null||Date.now()-liveWaitUpdatedAt>90000)return null;return Math.max(PICKUP_BUFFER_MINUTES,Math.ceil(liveWaitMinutes+orderCups()))}
function updatePickupEstimate(){const el=$('pickupEstimate');if(!el)return;const minutes=estimatedPickupMinutes();el.textContent=minutes===null?'Live estimate temporarily unavailable — pickup time to be confirmed.':'Estimated ready in about '+minutes+' minutes (live queue + your order; subject to confirmation).'}

function sgNow(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Singapore',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return {date:p.year+'-'+p.month+'-'+p.day,minutes:Number(p.hour)*60+Number(p.minute)}}
function earliestPickup(){const now=sgNow(),mins=Math.ceil((now.minutes+(estimatedPickupMinutes()??PICKUP_BUFFER_MINUTES))/5)*5;return {date:now.date,time:String(Math.floor(mins/60)%24).padStart(2,'0')+':'+String(mins%60).padStart(2,'0'),nextDay:mins>=1440}}
function togglePickup(){const scheduled=val('pickupMode')==='scheduled';$('scheduledWrap')?.classList.toggle('hidden',!scheduled);if(scheduled){const e=earliestPickup();if($('pickupDate')&&!$('pickupDate').value)$('pickupDate').value=e.date;if($('pickupTime')&&!$('pickupTime').value&&!e.nextDay)$('pickupTime').value=e.time}}
function showCart(){refreshLiveWait();const total=cart.reduce((a,b)=>a+b.price,0);openSheet('<h2>your little bag ♡</h2>'+(cart.length?cart.map((x,i)=>'<div class="cartrow"><div><strong>'+esc(x.name)+'</strong><div class="muted">'+esc(x.details)+'</div><div>'+money(x.price)+'</div></div><button class="chip" onclick="cart.splice('+i+',1);render();showCart()">Remove</button></div>').join('')+'<h3>Total: '+money(total)+'</h3><div class="notice"><strong>Preview only.</strong> Pickup times are checked against regular hours in this preview; special closures are not yet connected. Please do not make a payment.</div><div class="field"><label for="customer">Customer name *</label><input id="customer" maxlength="80" autocomplete="name" placeholder="Your name"></div><div class="field"><label for="customerPhone">Phone number *</label><input id="customerPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="25" placeholder="e.g. 9123 4567"></div><div class="field"><label for="pickupMode">Preferred pickup *</label><select id="pickupMode" onchange="togglePickup()"><option value="asap">ASAP — based on live queue</option><option value="scheduled">Schedule for later</option></select></div><p id="pickupEstimate" class="notice" role="status">Checking current waiting time…</p><div id="scheduledWrap" class="hidden"><div class="field"><label for="pickupDate">Pickup date *</label><input id="pickupDate" type="date"></div><div class="field"><label for="pickupTime">Pickup time *</label><input id="pickupTime" type="time" step="300"></div><p class="muted">Pickup available Tuesday–Sunday, 11:00 AM–6:45 PM (SGT), subject to confirmation.</p></div><div class="field"><label for="customerNotes">Special instructions (optional)</label><textarea id="customerNotes" maxlength="500" rows="3" placeholder="Anything we should know?"></textarea></div><button class="mainbtn" onclick="checkout()">Continue to checkout preview</button>':'Your bag is empty. Add something delicious!')+'<p class="muted">TEST SITE — real checkout is disabled.</p>');togglePickup()}
const LAST_PICKUP_MINUTES=18*60+45,OPEN_MINUTES=11*60;
function pickupWithinHours(date,time){const stamp=Date.parse(date+'T'+time+':00+08:00');if(!Number.isFinite(stamp))return false;const day=new Date(stamp).getUTCDay();const [h,m]=time.split(':').map(Number);const mins=h*60+m;return day!==1&&mins>=OPEN_MINUTES&&mins<=LAST_PICKUP_MINUTES}
function asapPickupSlot(){const wait=estimatedPickupMinutes();if(wait===null)return null;const t=new Date(Date.now()+wait*60000);const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Singapore',year:'numeric',month:'2-digit',day:'2-digit'}).format(t);const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Singapore',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(t);return {date,time:parts,wait}}
function checkout(){const name=val('customer').trim(),phone=val('customerPhone').trim(),notes=val('customerNotes').trim(),mode=val('pickupMode');if(!name){alert('Please enter your name.');return}if(!/^\+?[0-9 ()-]{8,25}$/.test(phone)||phone.replace(/\D/g,'').length<8){alert('Please enter a valid phone number.');return}let pickupText=estimatedPickupMinutes()===null?'ASAP (live estimate unavailable; subject to confirmation)':'ASAP (approximately '+estimatedPickupMinutes()+' minutes; subject to confirmation)';if(mode==='asap'){const slot=asapPickupSlot();if(!slot){alert('Live pickup estimate is unavailable. Please try again shortly.');return}if(!pickupWithinHours(slot.date,slot.time)){alert('ASAP pickup is unavailable outside Tuesday–Sunday, 11 AM–6:45 PM. Please schedule a pickup during opening hours.');return}}if(mode==='scheduled'){const date=val('pickupDate'),time=val('pickupTime'),now=sgNow();if(!date||!time){alert('Please select a pickup date and time.');return}if(!pickupWithinHours(date,time)){alert('Pickup is available Tuesday–Sunday, 11:00 AM to 6:45 PM (Singapore time).');return}const selectedMs=Date.parse(date+'T'+time+':00+08:00');if(!Number.isFinite(selectedMs)||selectedMs<Date.now()+(estimatedPickupMinutes()??PICKUP_BUFFER_MINUTES)*60000){alert('Please choose a pickup time after the current estimated preparation time (Singapore time).');return}pickupText=date+' '+time+' SGT (subject to confirmation)'}const total=cart.reduce((a,b)=>a+b.price,0);openSheet('<h2>Checkout preview ♡</h2><div class="notice"><strong>TEST MODE — DO NOT PAY.</strong> No order will be submitted, and pickup availability is not yet confirmed.</div><h2 style="text-align:center">'+money(total)+'</h2><p><strong>Name:</strong> '+esc(name)+'</p><p><strong>Phone:</strong> '+esc(phone)+'</p><p><strong>Pickup:</strong> '+esc(pickupText)+'</p>'+(notes?'<p><strong>Instructions:</strong> '+esc(notes)+'</p>':'')+'<div class="notice">Next, the live checkout will show PayNow instructions and accept payment proof. Staff must verify the actual transaction before accepting an order.</div><div class="field file"><label for="proof">Payment screenshot (preview only)</label><input id="proof" type="file" accept="image/png,image/jpeg,image/webp"><p class="muted">This file stays on your device. Nothing is uploaded.</p></div><button class="mainbtn" disabled>Submit order (disabled until backend testing is complete)</button>')}
loadMenu();
setInterval(()=>{if($('pickupEstimate'))refreshLiveWait()},30000);

</script></body></html>
