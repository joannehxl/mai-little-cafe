<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf6ed"><title>mai little café | order online</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#49352e;background:#faf6ed}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;background:#faf6edf5;border-bottom:1px solid #dfd5c7;padding:13px 5%;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:800;letter-spacing:-1px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.pill,.mainbtn{border:0;border-radius:25px;padding:11px 16px;background:#513b31;color:white}.mainbtn{width:100%;font-weight:700;padding:16px}.outline{background:transparent;color:#513b31;border:1px solid #cfc0b2}.hero{background:#e6e9cb;padding:22px 5% 0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:230px;overflow:hidden}.hero h1{font-size:clamp(30px,7vw,64px);line-height:.96;letter-spacing:-2px;margin:10px 0}.hero p{font-size:13px}.hero img{width:42%;max-height:290px;object-fit:cover;object-position:center 55%;border-radius:20px 20px 0 0}main{max-width:1000px;margin:auto;padding:25px 5% 90px}.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 20px}.chip{border:1px solid #c9b9a9;background:transparent;padding:10px 15px;border-radius:25px;white-space:nowrap}.chip.active{background:#513b31;color:white}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.product{background:white;border:1px solid #e8ded3;border-radius:17px;overflow:hidden;display:flex;flex-direction:column}.product img{width:100%;height:160px;object-fit:cover;object-position:center 58%}.product .details{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.product .details button{align-self:flex-end}.muted{color:#82756a;font-size:13px}.overlay{position:fixed;inset:0;background:#231b178c;z-index:10;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:#faf6ed;border-radius:22px 22px 0 0;width:min(100%,530px);padding:22px;max-height:92dvh;overflow:auto}.sheet h2{margin:0 0 12px}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.field select,.field input{width:100%;border:1px solid #cdbfb0;border-radius:9px;background:white;padding:12px}.close{float:right;border:0;background:transparent;font-size:24px}.cartrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e5d9ca}.notice{background:#f0e7db;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.qr{width:min(100%,280px);display:block;margin:15px auto}.hidden{display:none!important}footer{text-align:center;font-size:12px;color:#86786e;padding:24px}.file{border:2px dashed #d5c4b5;border-radius:12px;padding:18px}.small{font-size:12px}.logo{height:38px;width:38px;object-fit:cover;border-radius:50%}@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}.hero{border-radius:0 0 20px 20px}}
.checkoption{display:block!important;font-weight:400!important;margin:10px 0!important}.checkoption input{width:auto!important}.error{color:#a13226;font-size:13px;font-weight:700}
</style></head><body><header><div style="display:flex;align-items:center;gap:8px"><img class="logo" src="assets/logo.jpeg" alt="Mai Little Cafe logo"><span class="brand">mai little café.</span></div><button class="pill" onclick="showCart()">Bag <span id="count">0</span></button></header><section class="hero"><div><p>YOUR LITTLE DAILY RITUAL ♡</p><h1>something<br>lovely awaits.</h1><p>Matcha, coffee & little treats.</p><button class="pill" onclick="document.querySelector('main').scrollIntoView({behavior:'smooth'})">Explore menu ↓</button></div><img src="assets/strawberry.jpeg" alt="Strawberry Matcha"></section><main><h2>our menu.</h2><div class="chips" id="chips"></div><div class="products" id="products"></div></main><footer>mai little café · Made with a little love ♡<br><strong>TEST SITE — NOT ACCEPTING REAL ORDERS</strong></footer><div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><section class="sheet" id="sheet"></section></div><script>

const SB_URL='https://exfbjssyljnhowzhfupi.supabase.co', SB_KEY='sb_publishable_w9gKKsSln4uu8Ar2zdsNhA_ilyHsuJa';
const photos={'Strawberry Matcha':'strawberry.jpeg','Biscoff Matcha':'biscoff.jpeg','Cookies & Cream Matcha':'cookiesmatcha.jpeg','Pistachio Cloud Matcha':'pistachiomatcha.jpeg','Peanut Butter Latte':'peanut.jpeg','Cookies and Cream Latte':'cookieslatte.jpeg','Salted Maple Jasmine Coffee':'jasmine.jpeg','Cold Brew Black':'black.jpeg','Salted Maple Cold Brew':'maplecoldbrew.jpeg','Pistachio Cloud Cold Brew':'pistachiocoldbrew.jpeg'};
let menu=[],sweetness=[],addons=[],allowedAddons=[],iceOptions=[],fillOptions=[],category='Matcha',cart=[],selected=null;
const $=id=>document.getElementById(id),money=x=>'S$'+Number(x).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function getTable(table,order=''){const res=await fetch(SB_URL+'/rest/v1/'+table+'?select=*'+(order?'&order='+order:''),{headers:{apikey:SB_KEY}});if(!res.ok)throw Error(table+' ('+res.status+')');return res.json()}
async function loadMenu(){try{[menu,sweetness,addons,allowedAddons,iceOptions,fillOptions]=await Promise.all([getTable('cafe_menu','display_order.asc'),getTable('cafe_sweetness_options','display_order.asc'),getTable('cafe_addons','display_order.asc'),getTable('cafe_menu_addons'),getTable('cafe_ice_options','display_order.asc'),getTable('cafe_fill_options','display_order.asc')]);render()}catch(e){$('products').innerHTML='<div class="notice">Menu is temporarily unavailable. Please try refreshing the page.</div>';console.error('Menu loading failed:',e)}}
function render(){const categories=[...new Set(menu.map(m=>m.category))];if(!categories.includes(category))category=categories[0]||'Matcha';$('chips').innerHTML=categories.map(k=>'<button class="chip '+(k===category?'active':'')+'" data-category="'+esc(k)+'">'+esc(k)+'</button>').join('');$('chips').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.category;render()}));const items=menu.filter(m=>m.category===category&&m.available);$('products').innerHTML=items.map(m=>'<article class="product">'+(photos[m.name]?'<img src="assets/'+photos[m.name]+'" alt="'+esc(m.name)+'">':'')+'<div class="details"><strong>'+esc(m.name)+'</strong><span class="muted">'+money(m.price)+(m.hot_available?' · Hot available':'')+'</span><button class="pill" data-id="'+esc(m.id)+'">Add +</button></div></article>').join('');$('products').querySelectorAll('button[data-id]').forEach(b=>b.addEventListener('click',()=>customise(b.dataset.id)));$('count').textContent=cart.length}
function openSheet(html){$('sheet').innerHTML='<button class="close" aria-label="Close" onclick="closeSheet()">×</button>'+html;$('overlay').classList.add('show')}
function closeSheet(){$('overlay').classList.remove('show')}
function field(id,label,choices,required=true){return '<div class="field"><label for="'+id+'">'+esc(label)+(required?' *':'')+'</label><select id="'+id+'"><option value="">Choose an option</option>'+choices.map(c=>'<option value="'+esc(c[0])+'">'+esc(c[1])+'</option>').join('')+'</select></div>'}
function val(id){return $(id)?.value||''}
function itemSweet(m){return sweetness.filter(s=>s.menu_item_id===m.id)}
function itemAddons(m){const ids=new Set(allowedAddons.filter(x=>x.menu_item_id===m.id).map(x=>x.addon_id));return addons.filter(a=>ids.has(a.id))}
function customise(id){selected=menu.find(m=>m.id===id);if(!selected)return;const m=selected,s=itemSweet(m),a=itemAddons(m),dessert=m.category==='Desserts';let html='<h2>'+esc(m.name)+'</h2><p>'+money(m.price)+'</p>';
if(m.hot_available&&m.iced_available)html+=field('temp','Temperature',[['Iced','Iced'],['Hot','Hot']]);
else if(!dessert)html+='<p class="muted">Iced only</p>';
if(s.length)html+=field('sweet','Sweetness',s.map(x=>[x.value,x.label+(x.description?' — '+x.description:'')]));
if(!dessert)html+='<div id="iceWrap">'+field('ice','Ice level',iceOptions.map(x=>[x.value,x.label]))+'<div id="fillWrap"></div><div id="iceNote"></div></div>';
if(a.length)html+='<div class="field"><label>Add-ons (optional)</label>'+a.map(x=>'<label class="checkoption"><input type="checkbox" class="addon" value="'+esc(x.id)+'"> '+esc(x.name)+' (+'+money(x.price)+')</label>').join('')+'</div>';
html+='<p id="selectionError" class="error" role="alert"></p><button class="mainbtn" onclick="addItem()">Add to bag</button>';
openSheet(html);$('temp')?.addEventListener('change',updateIce);$('ice')?.addEventListener('change',updateFill);updateIce()}
function updateIce(){if(!$('iceWrap'))return;const hot=val('temp')==='Hot';$('iceWrap').classList.toggle('hidden',hot);if(hot){$('ice').value='';$('fillWrap').innerHTML='';$('iceNote').innerHTML=''}else updateFill()}
function updateFill(){if(!$('ice'))return;const v=val('ice');$('fillWrap').innerHTML='';$('iceNote').innerHTML='';if(v==='less'){const choices=fillOptions.filter(f=>!f.requires_milk_compatibility||selected.milk_topup_allowed).map(f=>[f.value,f.label+' — '+f.description]);$('fillWrap').innerHTML=field('fill','Less Ice fill level',choices)}else if(v==='none')$('iceNote').innerHTML='<div class="notice">Your drink will be prepared without ice using our standard recipe. The cup will not be full, as we do not add extra milk to maintain the intended flavour.</div>'}
function addItem(){const m=selected,hot=val('temp')==='Hot',dessert=m.category==='Desserts',s=itemSweet(m),a=itemAddons(m),error=$('selectionError');if(!dessert&&m.hot_available&&m.iced_available&&!val('temp')){error.textContent='Please choose a temperature.';return}if(s.length&&!val('sweet')){error.textContent='Please choose your sweetness level.';return}if(!dessert&&!hot&&!val('ice')){error.textContent='Please choose an ice level.';return}if(!dessert&&!hot&&val('ice')==='less'&&!val('fill')){error.textContent='Please choose a fill level.';return}
const picked=[...document.querySelectorAll('.addon:checked')].map(x=>a.find(y=>y.id===x.value)).filter(Boolean),sOption=s.find(x=>x.value===val('sweet')),fill=fillOptions.find(x=>x.value===val('fill'));let details=[dessert?'':hot?'Hot':'Iced',sOption?.label,(!dessert&&!hot)?iceOptions.find(x=>x.value===val('ice'))?.label:'',fill?.label,...picked.map(x=>x.name)].filter(Boolean).join(' · ');const price=Number(m.price)+picked.reduce((sum,x)=>sum+Number(x.price),0);cart.push({menu_item_id:m.id,name:m.name,quantity:1,temperature:dessert?null:hot?'hot':'iced',sweetness:sOption?.value||null,ice:dessert||hot?null:val('ice'),fill:dessert||hot||val('ice')!=='less'?null:val('fill'),addon_ids:picked.map(x=>x.id),details,price});closeSheet();render()}
function showCart(){const total=cart.reduce((a,b)=>a+b.price,0);openSheet('<h2>your little bag ♡</h2>'+(cart.length?cart.map((x,i)=>'<div class="cartrow"><div><strong>'+esc(x.name)+'</strong><div class="muted">'+esc(x.details)+'</div><div>'+money(x.price)+'</div></div><button class="chip" onclick="cart.splice('+i+',1);render();showCart()">Remove</button></div>').join('')+'<h3>Total: '+money(total)+'</h3>'+field('type','Order type',[['Pickup','Order ahead for pickup'],['In-store','At the café']])+'<div class="field"><label for="customer">Name for collection</label><input id="customer" maxlength="80" placeholder="Your name"></div><div class="field"><label for="pickup">Pickup time</label><input id="pickup" type="time"></div><button class="mainbtn" onclick="checkout()">Continue to PayNow preview</button>':'Your bag is empty. Add something delicious!')+'<p class="muted">Test mode — no real orders can be placed.</p>')}
function checkout(){let name=val('customer').trim();if(!name){alert('Please enter a name');return}let total=cart.reduce((a,b)=>a+b.price,0),type=val('type'),pickup=val('pickup');openSheet('<h2>PayNow checkout preview</h2><div class="notice"><strong>TEST MODE</strong> — Do not make a payment. This is a preview only, and no order will be submitted.</div><h2 style="text-align:center">'+money(total)+'</h2><p style="text-align:center">'+esc(name)+' · '+esc(type)+' '+esc(pickup)+'</p><img class="qr" src="assets/paynow.jpeg" alt="Mai Little Cafe SGQR"><p class="small">For the live site: save the QR to your phone or scan it with your banking app, pay the exact amount, then upload a screenshot. The café will verify receipt before preparing.</p><div class="field file"><label for="proof">Payment screenshot (preview only)</label><input id="proof" type="file" accept="image/*"><p class="muted">Screenshots are not uploaded or stored in this preview.</p></div><button class="mainbtn" disabled>Submit payment for verification (available after backend setup)</button>')}
loadMenu();

</script></body></html>
