<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf6ed"><title>mai little café | order online</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#49352e;background:#faf6ed}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;background:#faf6edf5;border-bottom:1px solid #dfd5c7;padding:13px 5%;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:800;letter-spacing:-1px}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.pill,.mainbtn{border:0;border-radius:25px;padding:11px 16px;background:#513b31;color:white}.mainbtn{width:100%;font-weight:700;padding:16px}.outline{background:transparent;color:#513b31;border:1px solid #cfc0b2}.hero{background:#e6e9cb;padding:22px 5% 0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:230px;overflow:hidden}.hero h1{font-size:clamp(30px,7vw,64px);line-height:.96;letter-spacing:-2px;margin:10px 0}.hero p{font-size:13px}.hero img{width:42%;max-height:290px;object-fit:cover;object-position:center 55%;border-radius:20px 20px 0 0}main{max-width:1000px;margin:auto;padding:25px 5% 90px}.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 20px}.chip{border:1px solid #c9b9a9;background:transparent;padding:10px 15px;border-radius:25px;white-space:nowrap}.chip.active{background:#513b31;color:white}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}.product{background:white;border:1px solid #e8ded3;border-radius:17px;overflow:hidden;display:flex;flex-direction:column}.product img{width:100%;height:160px;object-fit:cover;object-position:center 58%}.product .details{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.product .details button{align-self:flex-end}.muted{color:#82756a;font-size:13px}.overlay{position:fixed;inset:0;background:#231b178c;z-index:10;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:#faf6ed;border-radius:22px 22px 0 0;width:min(100%,530px);padding:22px;max-height:92dvh;overflow:auto}.sheet h2{margin:0 0 12px}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.field select,.field input{width:100%;border:1px solid #cdbfb0;border-radius:9px;background:white;padding:12px}.close{float:right;border:0;background:transparent;font-size:24px}.cartrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e5d9ca}.notice{background:#f0e7db;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.qr{width:min(100%,280px);display:block;margin:15px auto}.hidden{display:none!important}footer{text-align:center;font-size:12px;color:#86786e;padding:24px}.file{border:2px dashed #d5c4b5;border-radius:12px;padding:18px}.small{font-size:12px}.logo{height:38px;width:38px;object-fit:cover;border-radius:50%}@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px}.hero{border-radius:0 0 20px 20px}}
</style></head><body><header><div style="display:flex;align-items:center;gap:8px"><img class="logo" src="assets/logo.jpeg" alt="Mai Little Cafe logo"><span class="brand">mai little café.</span></div><button class="pill" onclick="showCart()">Bag <span id="count">0</span></button></header><section class="hero"><div><p>YOUR LITTLE DAILY RITUAL ♡</p><h1>something<br>lovely awaits.</h1><p>Matcha, coffee & little treats.</p><button class="pill" onclick="document.querySelector('main').scrollIntoView({behavior:'smooth'})">Explore menu ↓</button></div><img src="assets/strawberry.jpeg" alt="Strawberry Matcha"></section><main><h2>our menu.</h2><div class="chips" id="chips"></div><div class="products" id="products"></div></main><footer>mai little café · Made with a little love ♡<br><strong>TEST SITE — NOT ACCEPTING REAL ORDERS</strong></footer><div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><section class="sheet" id="sheet"></section></div><script>
const groups={"Matcha":[['Daily Matcha Latte',4.9,1],['Strawberry Matcha',5.9,1,'strawberry.jpeg'],['Black Sesame Matcha',5.9,1],['Biscoff Matcha',6.9,0,'biscoff.jpeg'],['Cookies & Cream Matcha',6.9,0,'cookiesmatcha.jpeg'],['Pistachio Cloud Matcha',6.9,0,'pistachiomatcha.jpeg'],['Tokyo Fog',6.9,0],['Banana Pudding Matcha',7.5,0]],"Coffee":[['Americano',3.9,1],['House Latte',4.5,1],['Mocha',4.9,1],['Spanish Latte',4.9,1],['Peanut Butter Latte',5.5,1,'peanut.jpeg'],['Banana Bread Latte',5.5,0],['Cookies and Cream Latte',5.5,0,'cookieslatte.jpeg'],['Salted Maple Jasmine Coffee',5.9,0,'jasmine.jpeg']],"Cold Brew":[['Cold Brew Black',4.9,0,'black.jpeg'],['Cold Brew White',5.5,0],['Salted Maple Cold Brew',6.5,0,'maplecoldbrew.jpeg'],['Pistachio Cloud Cold Brew',6.9,0,'pistachiocoldbrew.jpeg']],"Tea":[['Jasmine Tea',3,0],['Honey Lemon Earl Grey',4,1]],"Caffeine-Free":[['Strawberry Au Lait',4.5,0],['Cookies and Cream Au Lait',4.5,0]],"Desserts":[['Banana Pudding',7.5,0]]};
let category='Matcha',cart=[],selected=null;const money=x=>'S$'+x.toFixed(2),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){document.getElementById('chips').innerHTML=Object.keys(groups).map(k=>`<button class="chip ${k===category?'active':''}" onclick="category=${JSON.stringify(k).replace(/"/g,'&quot;')};render()">${esc(k)}</button>`).join('');document.getElementById('products').innerHTML=groups[category].map((p,i)=>`<article class="product">${p[3]?`<img src="assets/${p[3]}" alt="${esc(p[0])}">`:''}<div class="details"><strong>${esc(p[0])}</strong><span class="muted">${money(p[1])}${p[2]?' · Hot available':''}</span><button class="pill" onclick="customise(${i})">Add +</button></div></article>`).join('');document.getElementById('count').textContent=cart.length}function openSheet(html){document.getElementById('sheet').innerHTML=`<button class="close" aria-label="Close" onclick="closeSheet()">×</button>`+html;document.getElementById('overlay').classList.add('show')}function closeSheet(){document.getElementById('overlay').classList.remove('show')}function opt(id,label,choices){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${choices.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('')}</select></div>`}function customise(i){selected={...{cat:category},p:groups[category][i]};let p=selected.p;openSheet(`<h2>${esc(p[0])}</h2><p>${money(p[1])}</p>${p[2]?opt('temp','Temperature',[['Iced','Iced'],['Hot','Hot']]):''}${category!=='Desserts'&&category!=='Tea'?opt('sugar','Sugar (eligibility to be confirmed)',[['100%','100%'],['50%','50%'],['0%','0%']]):''}${category!=='Desserts'?opt('ice','Ice',[['Regular','Regular ice'],['Less','Less ice']]):''}${(['Matcha','Coffee','Caffeine-Free'].includes(category)&&p[0]!=='Americano')?opt('milk','Milk',[['Fresh','Fresh milk'],['Oat','Oat milk (+S$0.50)']]):''}${['Matcha','Coffee'].includes(category)?opt('extra','Extra',[['No','None'],['Yes',category==='Matcha'?'Extra matcha 1g (+S$0.50)':'Extra espresso shot (+S$1.00)']]):''}<div class="notice">Some customisations may not apply to every drink. Confirm drink-specific rules before publishing.</div><br><button class="mainbtn" onclick="addItem()">Add to bag</button>`)}function val(id){return document.getElementById(id)?.value||''}function addItem(){let p=selected.p,details=[val('temp')||'Iced',val('sugar')&&val('sugar')+' sugar',val('ice')&&val('ice')+' ice',val('milk')==='Oat'?'Oat milk':'',val('extra')==='Yes'?'Extra '+(selected.cat==='Matcha'?'matcha':'shot'):''].filter(Boolean).join(' · ');let price=p[1]+(val('milk')==='Oat'?.5:0)+(val('extra')==='Yes'?(selected.cat==='Matcha'?.5:1):0);cart.push({name:p[0],details,price});closeSheet();render()}function showCart(){let total=cart.reduce((a,b)=>a+b.price,0);openSheet(`<h2>your little bag ♡</h2>${cart.length?cart.map((x,i)=>`<div class="cartrow"><div><strong>${esc(x.name)}</strong><div class="muted">${esc(x.details)}</div><div>${money(x.price)}</div></div><button class="chip" onclick="cart.splice(${i},1);render();showCart()">Remove</button></div>`).join('')+`<h3>Total: ${money(total)}</h3>${opt('type','Order type',[['Pickup','Order ahead for pickup'],['In-store','At the café']])}<div class="field"><label for="customer">Name for collection</label><input id="customer" maxlength="80" placeholder="Your name"></div><div class="field"><label for="pickup">Pickup time</label><input id="pickup" type="time"></div><button class="mainbtn" onclick="checkout()">Continue to PayNow preview</button>`:'Your bag is empty. Add something delicious!'}<p class="muted">Test mode — no real orders can be placed.</p>`)}function checkout(){let name=document.getElementById('customer').value.trim();if(!name){alert('Please enter a name');return}let total=cart.reduce((a,b)=>a+b.price,0);let type=val('type'),pickup=val('pickup');openSheet(`<h2>PayNow checkout preview</h2><div class="notice"><strong>TEST MODE</strong> — Do not make a payment. This is a preview only, and no order will be submitted.</div><h2 style="text-align:center">${money(total)}</h2><p style="text-align:center">${esc(name)} · ${esc(type)} ${pickup?'· '+esc(pickup):''}</p><img class="qr" src="assets/paynow.jpeg" alt="Mai Little Cafe SGQR"><p class="small">For the live site: save the QR to your phone or scan it with your banking app, pay the exact amount, then upload a screenshot. The café will verify receipt before preparing.</p><div class="field file"><label for="proof">Payment screenshot (preview only)</label><input id="proof" type="file" accept="image/*" onchange="document.getElementById('fileinfo').textContent=this.files[0]?'Selected: '+this.files[0].name:'No file selected'"><p id="fileinfo" class="muted">No file selected</p></div><button class="mainbtn" disabled>Submit payment for verification (available after backend setup)</button><p class="muted">Screenshots are not uploaded or stored in this preview.</p>`)}render();
</script></body></html>
